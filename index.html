<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Image Gallery</h1>
    
    <div class="filters">
    <button onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('animals')">Animals</button>
    <button onclick="filterImages('city')">City</button>
</div>

    <div class="gallery">
    <img src="image1.jpg" class="nature" alt="Image 1">
    <img src="image2.jpg" class="animals" alt="Image 2">
    <img src="image3.jpg" class="city" alt="Image 3">
    <img src="image4.jpg" class="nature" alt="Image 4">
    <img src="image5.jpg" class="animals" alt="Image 5">
    <img src="image6.jpg" class="city" alt="Image 6">
</div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <button id="close">×</button>

        <button id="prev">❮</button>

        <img id="lightboxImage" src="" alt="Large Image">

        <button id="next">❯</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
